name: CI

on:
  pull_request:
    branches: [master, cross-platform-builds]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  rust:
    name: Rust
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: src-tauri

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select stable Rust
        run: rustup default stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: "ci"

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run tests
        run: cargo test --locked

  tauri:
    name: Tauri ${{ matrix.name }} Build
    needs: [frontend, rust]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            platform: windows-latest
          - name: Linux
            platform: ubuntu-22.04
          - name: macOS
            platform: macos-latest
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libssl-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: "ci-${{ matrix.name }}"

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1

  macos-bundle:
    name: macOS DMG Launch
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Select stable Rust
        run: rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: npm ci --prefer-offline --no-audit
      - name: Build app and DMG
        run: npm run tauri:build
      - name: Launch app installed from DMG
        shell: bash
        run: |
          set -euo pipefail
          volume="$RUNNER_TEMP/novatorrent-volume"
          installed="$RUNNER_TEMP/novatorrent-installed"
          mkdir -p "$installed"
          hdiutil attach -readonly -nobrowse -mountpoint "$volume" src-tauri/target/release/bundle/dmg/*.dmg
          trap 'hdiutil detach "$volume"' EXIT
          ditto "$volume/NovaTorrent.app" "$installed/NovaTorrent.app"
          swift scripts/macos-window-smoke.swift "$installed/NovaTorrent.app"
