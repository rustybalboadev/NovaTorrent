name: Branch test builds

on:
  workflow_dispatch:
  push:
    branches:
      - cross-platform-builds

permissions:
  contents: read

concurrency:
  group: branch-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            args: ""
            rustTargets: ""
            artifactName: NovaTorrent-windows-x64
            artifactPath: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          - name: Linux x64 Debian package
            platform: ubuntu-22.04
            args: "--bundles deb"
            rustTargets: ""
            artifactName: NovaTorrent-linux-x64-deb
            artifactPath: src-tauri/target/release/bundle/deb/*.deb
          - name: macOS Apple Silicon
            platform: macos-latest
            args: "--target aarch64-apple-darwin"
            rustTargets: aarch64-apple-darwin
            artifactName: NovaTorrent-macos-apple-silicon
            artifactPath: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - name: macOS Intel
            platform: macos-latest
            args: "--target x86_64-apple-darwin"
            rustTargets: x86_64-apple-darwin
            artifactName: NovaTorrent-macos-intel
            artifactPath: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libssl-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: "branch-${{ matrix.artifactName }}"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build NovaTorrent
        uses: tauri-apps/tauri-action@v1
        with:
          args: ${{ matrix.args }}

      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifactName }}
          path: ${{ matrix.artifactPath }}
          if-no-files-found: error
          retention-days: 7
