name: Branch test builds

on:
  workflow_dispatch:
  push:
    branches:
      - cross-platform-builds

permissions:
  contents: read

concurrency:
  group: branch-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Linux x64 Debian package
    runs-on: ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libssl-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: branch-linux-x64-deb

      - name: Install frontend dependencies
        run: npm ci

      - name: Build NovaTorrent
        uses: tauri-apps/tauri-action@v1
        with:
          args: --bundles deb

      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: NovaTorrent-linux-x64-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 7
