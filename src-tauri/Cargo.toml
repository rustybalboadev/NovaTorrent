[package]
name = "novatorrent"
version = "1.0.2"
description = "A modern BitTorrent client built with Rust, Tauri, Next.js, React, and TypeScript."
authors = ["NovaTorrent contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "novatorrent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
getrandom = "0.4"
native-tls = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
